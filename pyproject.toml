[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odra5-router"
version = "1.0.0"
description = "Fidelity-aware qubit routing for the Odra5 star topology: Tabu Search, a Genetic Algorithm and an exact DP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "qiskit==1.2.4",
    "qiskit-iqm==17.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Everything needed to rerun the experiments, the analysis and the figures.
experiments = [
    "qiskit-aer==0.15.1",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905"]
